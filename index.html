<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b5d73">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MankevCars">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="config.js"></script>
<title>MankevCars</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3f4;--card:#fff;--text:#0f1e24;--muted:#5b6d75;--line:#dce6e8;--red:#b3262a;--yel:#8a5a00;--grn:#17743c;--accent:#0b5d73;--ink:#fff;--hero:linear-gradient(135deg,#cfe6ec,#eaf5f7);--shadow:0 1px 2px rgba(15,30,36,.06),0 10px 28px rgba(15,30,36,.07);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1316;--card:#131d21;--text:#e8f0f2;--muted:#8fa3ab;--line:#22323a;--red:#ff8587;--yel:#f5c860;--grn:#5fd38d;--accent:#4cc3de;--ink:#04222b;--hero:linear-gradient(135deg,#17323b,#10242b);--shadow:0 1px 0 rgba(255,255,255,.04);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1316;--card:#131d21;--text:#e8f0f2;--muted:#8fa3ab;--line:#22323a;--red:#ff8587;--yel:#f5c860;--grn:#5fd38d;--accent:#4cc3de;--ink:#04222b;--hero:linear-gradient(135deg,#17323b,#10242b);--shadow:0 1px 0 rgba(255,255,255,.04);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:500}
main{max-width:640px;margin:0 auto;padding:18px 16px 36px}
button{font:inherit;font-weight:700;cursor:pointer;transition:background .15s,transform .15s}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.top{display:flex;align-items:center;gap:8px}
h1{font-size:1.7rem;font-weight:800;letter-spacing:-.02em;margin:0 auto 0 0}
h1 span{color:var(--accent)}
.ghost{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.icon{width:42px;height:42px;padding:0;display:grid;place-items:center}
.icon svg,.ico svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.icon svg{width:21px;height:21px}
.primary{background:var(--accent);color:var(--ink);border:0;border-radius:12px;padding:11px 16px;font-weight:800}
.primary:disabled{opacity:.5;cursor:not-allowed}
.tabs{position:relative;display:flex;gap:8px;overflow-x:auto;margin:18px -16px 16px;padding:0 16px 4px;scrollbar-width:none}
.tab{flex:0 0 auto;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:var(--card);color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:9px 17px}
.tab[data-tab="all"]{max-width:none}
.tab[aria-selected="true"]{background:var(--accent);color:var(--ink);border-color:var(--accent)}
.red{--c:var(--red);--t:color-mix(in srgb,var(--red) 13%,var(--card))}
.yellow{--c:var(--yel);--t:color-mix(in srgb,var(--yel) 15%,var(--card))}
.green{--c:var(--grn);--t:color-mix(in srgb,var(--grn) 13%,var(--card))}
.all{--c:var(--accent);--t:color-mix(in srgb,var(--accent) 13%,var(--card))}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.chip{background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:16px;padding:9px 4px;text-align:center;line-height:1.15}
.chip b{display:block;font-size:1.35rem;font-weight:800}
.chip small{color:var(--muted);font-size:.78rem;font-weight:700}
.chip.on{background:var(--t);border-color:var(--c)}
.chip.on b,.chip.on small{color:var(--c)}
.card{display:block;width:100%;text-align:left;background:var(--card);color:var(--text);font:inherit;font-weight:500;border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:14px 16px;margin-bottom:12px}
button.card:active{transform:scale(.99)}
.ci{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.ico{width:42px;height:42px;border-radius:13px;background:var(--t);color:var(--c);display:grid;place-items:center}
.ico svg{width:22px;height:22px}
.tt{display:grid;min-width:0}
.nm{font-weight:800;font-size:1.02rem;line-height:1.2}
.lb{color:var(--muted);font-size:.86rem}
.pill{background:var(--t);color:var(--c);font-weight:800;font-size:.78rem;border-radius:99px;padding:4px 11px;white-space:nowrap}
.cf{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:12px;padding-top:11px;border-top:1px solid var(--line)}
.tx{font-weight:800;font-size:1.06rem;color:var(--c)}
.dt{color:var(--muted);font-size:.86rem;text-align:right}
.hero{height:190px;border-radius:24px;overflow:hidden;background:var(--hero);color:var(--accent);display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.hero img{width:100%;height:100%;object-fit:cover}
.hero svg{width:76%;max-height:150px}
.carhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.id{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h2{font-size:1.35rem;font-weight:800;letter-spacing:-.01em;margin:0}
.acts{display:flex;gap:8px}
.plate{display:inline-flex;border:2px solid #15191c;border-radius:7px;overflow:hidden;background:#fff;color:#111;font-weight:800;letter-spacing:.07em;font-size:.95rem}
.plate i{background:#0b3fa8;color:#fff;font-style:normal;font-size:.6rem;letter-spacing:.02em;padding:3px 5px;display:flex;align-items:flex-end}
.plate span{padding:2px 10px}
.dc h3{margin:0 0 2px;font-size:.95rem;font-weight:800}
.dr{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.dc h3+.dr{border-top:0}
.dk{color:var(--muted);font-size:.82rem}
.dv{font-weight:800;letter-spacing:.03em;word-break:break-all}
.cp{padding:7px 12px;font-size:.85rem;white-space:nowrap}
.note{color:var(--muted);font-size:.86rem;margin-top:18px}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.empty div{color:var(--accent);opacity:.55;margin:0 auto 10px;max-width:220px}
dialog{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:24px;width:min(94vw,440px);max-height:90vh;overflow:auto;padding:20px}
dialog::backdrop{background:rgba(5,15,20,.55);backdrop-filter:blur(3px)}
dialog h2{margin-bottom:2px}
label{display:block;margin-top:13px;font-size:.86rem;font-weight:700;color:var(--muted)}
input{width:100%;padding:11px 12px;margin-top:5px;font:inherit;font-weight:500;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:12px}
.caps{text-transform:uppercase}
.row{display:flex;gap:8px;margin-top:20px;justify-content:flex-end}
.del{margin-right:auto;color:var(--red)}
.bell{display:grid;gap:10px}
.bell h3{margin:0;font-size:.95rem;font-weight:800}
.bell p{margin:0;color:var(--muted);font-size:.9rem}
.bell p b{color:var(--text)}
.bell .row{margin-top:2px;justify-content:flex-start;flex-wrap:wrap}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.sh{margin:14px 0 12px}
.bell .dr{padding:4px 0;border-top:0}
.lic{display:flex;align-items:center;gap:10px;width:100%;margin-top:12px;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:16px;padding:8px 12px;text-align:left;font-weight:500}
.lic .ico{width:34px;height:34px;border-radius:10px}
.lic .ico svg{width:19px;height:19px}
.lic .lt{display:grid;flex:1;min-width:0}
.lic .lt b{font-weight:800;font-size:.95rem}
.lic small{color:var(--muted)}
.lic.empty{color:var(--muted);border-style:dashed;--c:var(--accent);--t:color-mix(in srgb,var(--accent) 13%,var(--card))}
.le{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;background:none;color:var(--text);border:0;border-top:1px solid var(--line);padding:11px 0;font-weight:500}
.le span{display:grid;min-width:0}
.le b{font-weight:800}
.le small{color:var(--muted);font-size:.84rem}
.le .lr{text-align:right;white-space:nowrap;flex:0 0 auto;min-width:max-content}
.dc .lb{margin:6px 0}
.sum2{display:flex;gap:24px;margin:8px 0 6px}
.sum2 span{display:grid}
.sum2 small{color:var(--muted);font-size:.8rem}
.sum2 b{font-size:1.2rem;font-weight:800}
select{width:100%;padding:11px 12px;margin-top:5px;font:inherit;font-weight:500;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:12px}
#dtt{font-size:1.1rem;word-break:break-all}
#dpv img{width:100%;max-height:60vh;object-fit:contain;border-radius:12px;margin-top:8px}
a.primary{display:inline-block;text-decoration:none}
a.ig{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#833ab4,#e1306c 55%,#fcb045);color:#fff;border:0;text-decoration:none}
a.ig .ico{background:rgba(255,255,255,.22);color:#fff}
a.ig small{color:rgba(255,255,255,.9);font-size:.86rem}
.qr{background:#fff;border-radius:16px;padding:8px;width:min(100%,230px);margin:4px auto;line-height:0}
.qr svg{width:100%;height:auto;display:block}
html,body{-webkit-text-size-adjust:100%;text-size-adjust:100%}
@supports (-webkit-touch-callout:none){html,body{overflow-x:hidden;overscroll-behavior:none;touch-action:pan-x pan-y}}
details{margin-top:12px;border:1px dashed var(--line);border-radius:14px;padding:10px 12px}
summary{font-weight:700;cursor:pointer}
details .lb{margin:8px 0 0}
details .row{margin-top:10px}
.chk{display:flex;align-items:center;gap:10px;color:var(--text);font-weight:600}
.chk input{width:auto;margin:0}
.shcode{font-weight:800;font-size:1.5rem;letter-spacing:.08em;text-align:center;background:var(--bg);border:1px dashed var(--line);border-radius:14px;padding:14px;margin:12px 0 6px;word-break:break-all}
.carhead .acts{flex-wrap:wrap}
textarea{width:100%;min-height:96px;padding:11px 12px;font:inherit;font-weight:500;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:12px;resize:vertical}
.ico{width:46px;height:46px;border-radius:14px}
.ico svg{width:24px;height:24px;stroke-width:2}
.ico.t-insp{background:#2563eb;color:#fff}
.ico.t-ins{background:#db2777;color:#fff}
.ico.t-oil{background:#f97316;color:#fff}
.ico.t-lic{background:#0d9488;color:#fff}
.ico.thumb{padding:0;overflow:hidden}
.ico.thumb img{width:100%;height:100%;object-fit:cover}
.lic .ico{width:36px;height:36px;border-radius:11px}
.lic .ico svg{width:20px;height:20px}
.crow{display:flex;justify-content:space-between;align-items:center;gap:12px}
.crow h3{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.crow h3 .pill{font-size:.72rem}
details.fold.card{padding:0;margin-top:0}
details.fold>summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px}
details.fold>summary::-webkit-details-marker{display:none}
.fold .sm{display:grid}
.fold .sm b{font-size:.98rem;font-weight:800}
.fold .sm small{color:var(--muted);font-weight:500}
.fold .sm small.warn{color:var(--yel);font-weight:800}
.chev{width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .2s;margin-right:4px}
.fold[open] .chev{transform:rotate(-135deg)}
.fold .fb{padding:0 16px 16px;display:grid;gap:10px}
.fold .fb p{margin:0;color:var(--muted);font-size:.9rem}
.fold .fb p b{color:var(--text)}
.sep{border:0;border-top:1px solid var(--line);margin:6px 0;width:100%}
.faces{display:flex;gap:6px}
.face{flex:1;background:var(--bg);border:2px solid transparent;border-radius:16px;font-size:1.9rem;line-height:1;padding:9px 4px;transition:transform .15s,border-color .15s}
.face.on{border-color:var(--accent);transform:scale(1.1);background:color-mix(in srgb,var(--accent) 14%,var(--card))}
.bell p.cheer{color:var(--text);font-weight:700;min-height:1.4em}
.sent{position:relative;overflow:hidden}
.confetti{position:absolute;inset:0;pointer-events:none}
.confetti i{position:absolute;top:-12px;left:var(--x);width:7px;height:11px;background:var(--c);border-radius:2px;opacity:0;animation:conf 1.6s ease-out var(--d) 1 forwards}
@keyframes conf{0%{opacity:1;transform:translateY(0) rotate(var(--r))}100%{opacity:0;transform:translateY(190px) rotate(calc(var(--r) + 320deg))}}
.sup{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center;background:linear-gradient(135deg,#ffc15a,#ff7a59);color:#2a1500;border:0}
.sup h3{margin:0;font-size:1.12rem;font-weight:800}
.sup p{margin:4px 0 0;color:#4a2a08;font-size:.92rem}
.sup .cup svg{width:70px;height:70px;display:block}
.sup .cta{grid-column:1/-1;display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:6px}
.sup a.btn{background:#2a1500;color:#fff8ec;border-radius:12px;padding:11px 18px;font-weight:800;text-decoration:none}
.sup .dr{flex:1;min-width:200px;border:0;padding:0}
.sup .dk{color:#4a2a08}
.sup .dv{color:#2a1500}
.sup .cp{background:rgba(255,255,255,.6);border-color:transparent;color:#2a1500}
.steam path{animation:steam 2.6s ease-in-out infinite}
.steam path:nth-child(2){animation-delay:.5s}
.steam path:nth-child(3){animation-delay:1s}
@keyframes steam{0%{transform:translateY(6px);opacity:0}40%{opacity:.9}100%{transform:translateY(-6px);opacity:0}}
@media (prefers-reduced-motion:reduce){.steam path{animation:none;opacity:.8}.confetti{display:none}}
.lph{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.ph{display:grid;gap:6px;justify-items:center}
.phb{width:100%;aspect-ratio:1.6;border:1px dashed var(--line);border-radius:12px;background:var(--bg);display:grid;place-items:center;overflow:hidden;padding:0;color:var(--muted)}
.phb img{width:100%;height:100%;object-fit:cover}
.phb svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ph small{color:var(--muted);font-weight:700}
.phr{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.home{background:none;border:0;padding:0;font:inherit;color:inherit;letter-spacing:inherit;text-align:left;cursor:pointer}
button:active:not(:disabled){transform:scale(.97)}
.lic .lt b{font-size:.88rem}
.lic .pill{padding:3px 9px}
:root{--tx-insp:#2563eb;--tx-ins:#be185d;--tx-oil:#c2570c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--tx-insp:#7ab0ff;--tx-ins:#f58bbd;--tx-oil:#ffa45c}}
:root[data-theme="dark"]{--tx-insp:#7ab0ff;--tx-ins:#f58bbd;--tx-oil:#ffa45c}
.lb.t-insp,.nm.t-insp{color:var(--tx-insp)}
.lb.t-ins,.nm.t-ins{color:var(--tx-ins)}
.lb.t-oil,.nm.t-oil{color:var(--tx-oil)}
.lb.t-insp,.lb.t-ins,.lb.t-oil{font-weight:700}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;background:var(--muted)}
.dot.t-oil{background:#f97316}
.dot.t-insp{background:#2563eb}
.dot.t-ins{background:#db2777}
.dot.t-service{background:#0ea5e9}
.dot.t-repair{background:#ef4444}
.dot.t-tyres{background:#64748b}
.dot.t-parts{background:#a16207}
details.fold{overflow:hidden}
.fold .fb{position:relative}
.fold .fb p.cheer{color:var(--text);font-weight:700;min-height:1.4em}
.bell h3+.opts+h3{margin-top:6px}
.odo{display:flex;margin-top:10px}
.pr{color:var(--muted);font-size:.8rem;font-weight:600}
.sbp{width:100%;border-radius:12px;border:1px solid var(--line);margin-top:8px}
.dwrap{display:flex;gap:8px;align-items:flex-start}
.dwrap input{flex:1}
.dwrap .clr{margin-top:5px;align-self:stretch;padding:0 14px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%) translateY(16px);background:var(--text);color:var(--bg);padding:12px 16px;border-radius:14px;font-weight:700;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>
<main>
  <div class="top"><h1><button class="home" id="home">Mankev<span>Cars</span></button></h1><button class="ghost icon" id="lang" style="display:none">EN</button><button class="ghost icon" id="theme" style="display:none"></button><button class="ghost icon" id="gear" aria-label="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button><button class="primary" id="add" data-i="addS"></button></div>
  <div id="lic"></div>
  <div id="inst"></div>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <div id="view"></div>
  <p class="note" id="msg"></p>
  <input type="file" id="pf" accept="image/*" hidden>
  <div id="toast" role="status" aria-live="polite"></div>
</main>

<dialog id="dlg">
  <form id="f">
    <h2 id="ttl"></h2>
    <details id="codeBox"><summary data-i="impSum"></summary>
      <p class="lb" data-i="impText"></p>
      <input id="impCode" placeholder="XXXX-XXXX-XXXX" autocomplete="off" autocapitalize="characters" spellcheck="false">
      <div class="row"><button type="button" class="ghost" id="impGo" data-i="impBtn"></button></div>
      <p class="lb" id="impMsg"></p>
    </details>
    <div class="opts" id="typeOpts" style="margin-top:12px"><button type="button" class="tab" data-vt="car" aria-selected="true" data-i="tCar"></button><button type="button" class="tab" data-vt="trailer" aria-selected="false" data-i="tTrailer"></button></div>
    <label><span data-i="lName"></span><input name="name" required placeholder="2020 Dodge Grand Caravan"></label>
    <label><span data-i="lPlate"></span><input name="plate" class="caps" maxlength="10" placeholder="ABC123" autocomplete="off" autocapitalize="characters" spellcheck="false"></label>
    <label><span data-i="lVin"></span><input name="vin" class="caps" maxlength="17" autocomplete="off" autocapitalize="characters" spellcheck="false"></label>
    <label><span data-i="lReg"></span><input name="reg" class="caps" maxlength="20" autocomplete="off" autocapitalize="characters" spellcheck="false"></label>
    <label><span data-i="lInsp"></span><span class="dwrap"><input name="insp" type="date"><button type="button" class="ghost clr" data-clr="insp" data-i="clr"></button></span></label>

  if (f && navigator.canShare && navigator.canShare({files: [f]})) navigator.share({files: [f], title: bookName}).catch(function(){});
  else { var u = URL.createObjectURL(bookBlob), a = document.createElement("a"); a.href = u; a.download = bookName; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){ URL.revokeObjectURL(u); }, 5000); }
}
sbGo.onclick = async function(){
  var c = getCar(tab), s = T(); if (!c) return;
  sbGo.disabled = true; sbOut.innerHTML = '<p class="lb">' + s.sbBusy + '</p>';
  try {
    var r = await renderBook(c, {costs: document.getElementById("sbCosts").checked, reg: document.getElementById("sbReg").checked, photo: document.getElementById("sbPhoto").checked});
    bookBlob = r.pdf; bookName = ("mankevcars-" + (c.plate || short(c.name)) + "-" + dayStr()).replace(/[^A-Za-z0-9._-]+/g, "-") + ".pdf";
    if (bookUrl) URL.revokeObjectURL(bookUrl);
    bookUrl = URL.createObjectURL(r.preview);
    sbOut.innerHTML = '<img class="sbp" alt="" src="' + bookUrl + '"><p class="lb">' + r.pages + ' ' + s.sbPages + '</p><div class="row" style="justify-content:flex-start"><button type="button" class="primary" id="sbShare">' + s.sbShare + '</button></div>';
    document.getElementById("sbShare").onclick = shareBook;
  } catch (e) { sbOut.innerHTML = '<p><b>' + s.sbErr + '</b></p>'; }
  sbGo.disabled = false;
};

var odlg = document.getElementById("odlg"), odf = document.getElementById("odf");
function openOdo(){
  var c = getCar(tab); if (!c) return;
  document.getElementById("odoInfo").textContent = T().odoInfo(c.km, c.oilKm != null ? c.oilKm + (c.int || 15000) : null);
  document.getElementById("odoErr").textContent = ""; odf.km.value = c.km || "";
  odlg.showModal();
}
document.getElementById("ocancel").onclick = function(){ odlg.close(); };
odf.onsubmit = function(e){
  e.preventDefault();
  var c = getCar(tab), v = Number(odf.km.value);
  if (c.km && v < c.km) { document.getElementById("odoErr").textContent = T().odoLow(nf(c.km)); return; }
  c.km = v; addOdo(c, dayStr(), v); save(); render(); odlg.close();
};
document.getElementById("home").onclick = function(){ page = "main"; tab = "all"; filt = "all"; render(); window.scrollTo({top: 0, behavior: "smooth"}); };
["ddlg", "sdlg"].forEach(function(id){ var d = document.getElementById(id); d.addEventListener("click", function(e){ var r = d.getBoundingClientRect(); if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) d.close(); }); });
var dlg = document.getElementById("dlg"), f = document.getElementById("f"), delBtn = document.getElementById("del"), pf = document.getElementById("pf"), msg = document.getElementById("msg");
var addBtn = document.getElementById("add"), themeBtn = document.getElementById("theme"), langBtn = document.getElementById("lang"), root = document.documentElement;

function render(){
  var s = T();
  document.getElementById("lic").innerHTML = page === "main" ? licHtml() : "";
  document.getElementById("inst").innerHTML = page === "main" ? installHtml() : "";
  if (page === "settings") { document.getElementById("tabs").innerHTML = ""; document.getElementById("view").innerHTML = settingsHtml(); addBtn.disabled = cars.length >= MAX; return; }
  if (tab !== "all" && !getCar(tab)) tab = "all";
  document.getElementById("tabs").innerHTML = '<button class="tab" role="tab" data-tab="all" aria-selected="' + (tab === "all") + '">' + s.all + '</button>' +
    byType().map(function(c){ return '<button class="tab" role="tab" data-tab="' + c.id + '" aria-selected="' + (tab === c.id) + '">' + (c.type === "trailer" ? TRI : "") + esc(short(c.name)) + '</button>'; }).join("");
  var tb = document.getElementById("tabs"), sel = tb.querySelector('[aria-selected="true"]');
  if (sel) tb.scrollLeft = sel.offsetLeft - (tb.clientWidth - sel.offsetWidth) / 2;
  addBtn.disabled = cars.length >= MAX;
  if (cars.length >= MAX) msg.textContent = s.limit;
  var it = items(), v = document.getElementById("view");
  if (!cars.length) { v.innerHTML = '<div class="empty"><div>' + svg() + '</div>' + s.empty + '<div class="row" style="justify-content:center"><button class="primary" data-addcar="1">' + s.addS + '</button></div><p>' + s.emptyHint + '</p><button class="ghost" data-go="settings">' + s.sTitle + '</button></div>'; return; }
  if (tab === "all") {
    var n = {red:0, yellow:0, green:0}; it.forEach(function(i){ n[i.st]++; });
    var chips = [["all", it.length, s.allF], ["red", n.red, s.Urgent], ["yellow", n.yellow, s.Soon], ["green", n.green, s.OK]].map(function(x){
      return '<button class="chip ' + x[0] + (filt === x[0] ? " on" : "") + '" data-f="' + x[0] + '"><b>' + x[1] + '</b><small>' + x[2] + '</small></button>';
    }).join("");
    v.innerHTML = '<div class="seg">' + chips + '</div>' + it.filter(function(i){ return filt === "all" || i.st === filt; }).map(function(i){ return row(i, true); }).join("");
  } else {
    var c = getCar(tab);
    v.innerHTML = '<div class="hero">' + (c.photo ? '<img alt="" src="' + c.photo + '">' : (c.type === "trailer" ? svgTrailer() : svg())) + '</div>' +
      '<div class="carhead"><div class="id"><h2>' + esc(c.name) + '</h2>' + plateHtml(c.plate) + '</div><div class="acts"><button class="ghost" data-act="photo">' + (c.photo ? s.chPh : s.addPh) + '</button><button class="ghost" data-act="share">' + SHICON + s.shBtn + '</button><button class="ghost" data-act="edit">' + s.edit + '</button></div></div>' +
      it.filter(function(i){ return i.c.id === c.id; }).map(function(i){ return row(i, false); }).join("") + details(c) + logHtml(c) + docsHtml(c);
  }
}

function themeUi(){
  var d = root.dataset.theme === "dark";
  themeBtn.innerHTML = d ? SUN : MOON;
  themeBtn.setAttribute("aria-label", d ? T().light : T().dark);
}
function applyLang(){
  var s = T();
  root.lang = lang;
  document.querySelectorAll("[data-i]").forEach(function(e){ e.textContent = s[e.dataset.i]; });
  themeUi(); langBtn.textContent = s.sw; gear.setAttribute("aria-label", s.sTitle);
  document.getElementById("tabs").setAttribute("aria-label", s.cars);
  msg.textContent = s.note;
  render();
}

function edit(id){
  if (!id && cars.length >= MAX) return;
  page = "main"; render();
  var c = getCar(id) || {}, s = T();
  cur = c.id || null; armed = false; delBtn.textContent = s.del; delBtn.style.display = cur ? "" : "none";
  document.getElementById("ttl").textContent = cur ? s.tEdit : s.tAdd;
  f.name.value = c.name || ""; f.plate.value = c.plate || ""; f.vin.value = c.vin || ""; f.reg.value = c.reg || "";
  f.insp.value = c.insp || ""; f.ins.value = c.ins || "";
  f.oilKm.value = c.oilKm != null ? c.oilKm : ""; f.km.value = c.km != null ? c.km : ""; f.int.value = c.int || 15000;
  setType(c.type || "car");
  incoming = null; document.getElementById("impMsg").textContent = ""; document.getElementById("impCode").value = ""; codeBox.open = false; codeBox.style.display = cur ? "none" : "";
  dlg.showModal();
}
function flash(b, k){ b.textContent = T()[k]; setTimeout(function(){ b.textContent = T().copy; }, 1300); }
addBtn.onclick = function(){ edit(null); };
document.getElementById("cancel").onclick = function(){ dlg.close(); };
document.getElementById("tabs").onclick = function(e){ var b = e.target.closest(".tab"); if (b) { tab = b.dataset.tab === "all" ? "all" : Number(b.dataset.tab); render(); window.scrollTo(0, 0); } };
document.getElementById("view").onclick = function(e){
  var nb = e.target.closest("[data-n]"); if (nb) { pushAct(nb.dataset.n); return; }
  var bb = e.target.closest("[data-b]"); if (bb) { bAct(bb.dataset.b); return; }
  var ac = e.target.closest("[data-addcar]"); if (ac) { edit(null); return; }
  var go = e.target.closest("[data-go]"); if (go) { page = go.dataset.go; render(); window.scrollTo(0, 0); return; }
  var st = e.target.closest("[data-set]"); if (st) { setOpt(st.dataset.set, st.dataset.v); return; }
  var cc = e.target.closest("[data-copycode]");
  if (cc) { if (navigator.clipboard) navigator.clipboard.writeText(getCode()).then(function(){ flash(cc, "copied"); }, function(){ flash(cc, "copyErr"); }); else flash(cc, "copyErr"); return; }
  var ci = e.target.closest("[data-copyiban]");
  if (ci) { if (navigator.clipboard) navigator.clipboard.writeText(String(self.MC_IBAN || "")).then(function(){ flash(ci, "copied"); }, function(){ flash(ci, "copyErr"); }); else flash(ci, "copyErr"); return; }
  var fr = e.target.closest("[data-fbr]"); if (fr) { fb.r = Number(fr.dataset.fbr); render(); return; }
  var fs = e.target.closest("[data-fb]"); if (fs) { if (fs.dataset.fb === "again") { fb.sent = false; render(); } else fbSend(); return; }
  var sh = e.target.closest("[data-share]"); if (sh) { inviteShare(sh); return; }
  var cu = e.target.closest("[data-copyurl]"); if (cu) { copyText(APP_URL, cu); return; }
  var sbb = e.target.closest("[data-sb]"); if (sbb) { openBook(); return; }
  var od = e.target.closest("[data-odo]"); if (od) { openOdo(); return; }
  var lg = e.target.closest("[data-log]"); if (lg) { openLog(lg.dataset.log); return; }
  var da = e.target.closest("[data-docadd]"); if (da) { dMsg = ""; df.click(); return; }
  var dd = e.target.closest("[data-doc]"); if (dd) { openDoc(Number(dd.dataset.doc)); return; }
  var ch = e.target.closest(".chip"); if (ch) { filt = ch.dataset.f; render(); return; }
  var cp = e.target.closest("[data-copy]");
  if (cp) {
    var val = getCar(tab)[cp.dataset.copy];
    if (navigator.clipboard) navigator.clipboard.writeText(val).then(function(){ flash(cp, "copied"); }, function(){ flash(cp, "copyErr"); }); else flash(cp, "copyErr");
    return;
  }
  var a = e.target.closest("[data-act]");
  if (a) { if (a.dataset.act === "edit") edit(tab); else if (a.dataset.act === "share") openShare(); else pf.click(); return; }
  var b = e.target.closest("button.card"); if (b) { tab = Number(b.dataset.id); render(); window.scrollTo(0, 0); }
};
pf.onchange = function(){
  var file = pf.files[0]; if (!file) return;
  var r = new FileReader();
  r.onload = function(){
    var im = new Image();
    im.onload = function(){
      var k = Math.min(1, 800 / im.width), cv = document.createElement("canvas");
      cv.width = Math.round(im.width * k); cv.height = Math.round(im.height * k);
      cv.getContext("2d").drawImage(im, 0, 0, cv.width, cv.height);
      var c = getCar(tab); c.photo = cv.toDataURL("image/jpeg", 0.72);
      msg.textContent = save() ? T().phOk : T().phErr;
      render();
    };
    im.src = r.result;
  };
  r.readAsDataURL(file); pf.value = "";
};
delBtn.onclick = function(){
  if (!armed) { armed = true; delBtn.textContent = T().del2; return; }
  dropDocs(cur); cars = cars.filter(function(x){ return x.id !== cur; }); save(); msg.textContent = T().note; render(); dlg.close();
};
f.onsubmit = function(e){
  e.preventDefault();
  var num = function(v){ return v === "" ? null : Number(v); }, up = function(el){ return el.value.trim().toUpperCase(); }, old = getCar(cur) || {};
  var rec = {id: cur || Date.now(), name: f.name.value.trim(), plate: up(f.plate), vin: up(f.vin), reg: up(f.reg), insp: f.insp.value, ins: f.ins.value, oilKm: num(f.oilKm.value), km: num(f.km.value), int: num(f.int.value) || 15000, photo: old.photo || (incoming && incoming.photo) || undefined, log: old.log || (incoming && incoming.log) || undefined, odo: old.odo, type: curType};
  if (curType === "trailer") { rec.oilKm = null; rec.km = null; }
  if (rec.km != null && rec.km !== old.km) addOdo(rec, dayStr(), rec.km);
  if (cur) cars = cars.map(function(x){ return x.id === cur ? rec : x; }); else if (cars.length < MAX) { cars.push(rec); tab = rec.id; incoming = null; }
  save(); render(); dlg.close();
};

function setTheme(t){ root.dataset.theme = t; themeUi(); try { localStorage.setItem(TKEY, t); } catch (e) {} }
themeBtn.onclick = function(){ setTheme(root.dataset.theme === "dark" ? "light" : "dark"); };
langBtn.onclick = function(){ lang = lang === "lt" ? "en" : "lt"; try { localStorage.setItem(GKEY, lang); } catch (e) {} applyLang(); syncPush(); };
try { lang = localStorage.getItem(GKEY) || "lt"; } catch (e) {}
var savedTheme = null; try { savedTheme = localStorage.getItem(TKEY); } catch (e) {}
setTheme(savedTheme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
applyLang();
if ("serviceWorker" in navigator) { navigator.serviceWorker.register("sw.js").catch(function(){}); }
refreshPush();
if (cars.length && autoDue()) schedAuto(4000);
maybePing(); loadLicImgs();
</script>
</body>
</html>
